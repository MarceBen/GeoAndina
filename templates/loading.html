<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>GeoAndina - Iniciando</title>
</head>
<body>

   <div class="loading-screen">

    
    <div class="loading-grid"></div>
    <div class="loading-scan"></div>

    <div class="contour contour-1"></div>
    <div class="contour contour-2"></div>
    <div class="contour contour-3"></div>
    <div class="contour contour-4"></div>

   
    <div class="geo-point point-1"></div>
    <div class="geo-point point-2"></div>
    <div class="geo-point point-3"></div>

    <div class="loading-container">

        <div class="loading-panel">

            <div class="loading-top">

                <div class="app-eyebrow">
                    SISTEMA DE PROCESAMIENTO GEODÉSICO
                </div>

                <div class="system-status">
                    <span class="status-dot"></span>
                    SISTEMA EN INICIALIZACIÓN
                </div>

            </div>


            <div class="loading-brand">

                <div class="brand-mark">
                    GA
                </div>

                <h1>
                    GeoAndina
                </h1>

                <div class="brand-line"></div>

                <p class="brand-subtitle">
                    MODELO GEOIDAL EGM2008
                </p>

                <p class="brand-country">
                    PERÚ
                </p>

            </div>


            <div class="loading-data">

                <div class="data-line">
                    <span>DATUM</span>
                    <strong>EGM2008</strong>
                </div>

                <div class="data-line">
                    <span>COORDENADAS</span>
                    <strong>UTM / GEODÉSICAS</strong>
                </div>

                <div class="data-line">
                    <span>MOTOR</span>
                    <strong>INTERPOLACIÓN GEOIDAL</strong>
                </div>

            </div>


            <div class="loading-progress-section">

                <div class="loading-progress-header">

                    <span id="loading-message">
                        Inicializando aplicación...
                    </span>

                    <span id="loading-percentage">
                        0%
                    </span>

                </div>

                <div class="loading-progress">

                    <div id="progress-bar"
                         class="loading-progress-bar">
                    </div>

                </div>

            </div>


            <div class="loading-footer">

                <div>
                    GeoAndina v1.1
                </div>

                <div>
                    © 2026 Marcelo Benites
                </div>

            </div>

        </div>

    </div>

</div>
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>
    
</body>
</html>
