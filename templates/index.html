<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>GeoAndina v1.1</title>

</head>

<body>


<div class = "container vh-100">

    <div class = "row justify-content-center align-items-center h-100 col-lg-8 col-xl-7 ">

            <div class = "card">

                <div class="card-body">

                    <div class = "text-center">

                        <h1 my-1>GeoAndina</h1>
                        <p my-1>Software de calculos geodesico</p>
                        <p my-1><strong>EGM2008 - Perú</strong></p>
                       

                    </div>
                    
                    <form method="POST">

                        <div class = "row">

                            <div class = "col-md-4 mx-auto">

                                <label for="quantity">Cantidad de puntos a calcular:</label>
                    
                                <input type="number" id="quantity" name="quantity" step="1" class = "form-control" required>

                            </div>

                           
                        </div>

                        <div class = "text-center">

                            <button type="submit" class = "btn btn-primary mt-3 px-4">
                                Generar
                            </button>


                        </div>


                    </form>

                </div>
            
            </div>   



        </div>

    </div>
   



<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

</body>
</html>
