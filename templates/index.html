<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>GeoAndina v1.1</title>

</head>

<body>


<div class = "container vh-100">

    <div class = "row justify-content-center align-items-center h-100">

        <div class = "col-lg-7">

            <div class = "card">

                <div class="card-body">

                    <div class = "text-center">

                        <h1 class = "my-3">GeoAndina</h1>
                        <p class = "my-3">Software de cálculos geodésicos</p>
                        <p class = "my-3"><strong>EGM2008 - Perú</strong></p>
                       

                    </div>
                    
                    <form method="POST">

                        <div class = "row">

                            <div class = "col-md-4 mx-auto mt-2">

                                <label for="quantity">Puntos a generar:</label>
                    
                                <input type="number" id="quantity" name="quantity" step="1" class = "form-control" min="1" required>

                            </div>

                           
                        </div>

                        <div class = "text-center">

                            <button type="submit" class = "btn btn-primary mt-3 px-4">
                                Generar
                            </button>


                        </div>


                    </form>

                </div>
            
            </div>
            
        </div>

    </div>

    {% if result %}

    <div class = "text-center">

        <h2 class = "my-2">Resultados</h2>
        <p class = "my-2">Basados en los respectivos cálculos matemáticos del modelo.</p>

    </div>


    {% endif %}
   



<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

</body>
</html>
