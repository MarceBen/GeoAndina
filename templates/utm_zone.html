<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Zona UTM a trabjar</title>
</head>

<body>

    <div class = "container vh-100">

        <div class = "row justify-content-center align-items-center h-100">

            <div class = "col-lg-7">

                <div class = "card">

                    <div class  = "card-body">

                        <div class = "text-center">

                            <h1 class = "my-3">GeoAndina v1.1</h1>
                            <p class = "text-muted mb-4"><strong>Seleccione la zona UTM con el que desea trabajar.</strong></p>



                        </div>

                        <form method="POST">

                            <div class = "row text-center">

                                <div class = "col-4">

                                    <div class = "form-check d-flex justify-content-center align-items-center">

                                        <input class="form-check-input" type = "radio" name = "UTMZone" value = "17" id = "Zona17">
                                        <label class="form-check-label ms-2" for="Zona17"> Zona 17S</label>

                                        
                                    </div>


                                </div>

                                <div class = "col-4">

                                    <div class = "form-check d-flex justify-content-center align-items-center">

                                        <input class="form-check-input" type = "radio" name = "UTMZone" value = "18" id = "Zona18">
                                        <label class="form-check-label ms-2" for="Zona18"> Zona 18S</label>
                                    </div>

                                </div>

                                <div class = "col-4">

                                    <div class = "form-check d-flex justify-content-center align-items-center">

                                        <input class="form-check-input" type = "radio" name = "UTMZone" value = "19" id = "Zona19">
                                        <label class="form-check-label ms-2"  for="Zona19"> Zona 19S</label>

                                    </div>

                                </div>

                                

                            </div>

                            <div class = "mt-4 d-grid">

                                <button class = "btn btn-primary btn-lg" type="submit">
                                    Continuar
                                </button>

                            </div>




                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>
    
</body>
</html>
